<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجومك يا سو</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at bottom,#59417f,#20204e 60%,#090d27);color:white;font-family:Cairo,sans-serif;min-height:100vh}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px;position:relative;overflow:hidden}.panel{width:min(550px,100%);text-align:center;padding:26px 18px;background:#17183ebd;border:1px solid #ffffff40;border-radius:28px;z-index:1;backdrop-filter:blur(8px)}h1{color:#ffe4f0}.sub{line-height:1.9;color:#dedaf8}.stars{height:245px;position:relative;max-width:430px;margin:auto}.star{position:absolute;background:none;border:0;color:#fff3a8;font-size:34px;text-shadow:0 0 18px #fff3a8;cursor:pointer;animation:tw 2s infinite alternate}@keyframes tw{to{opacity:.35;transform:scale(.8)}}button{font:700 14px Cairo;border:1px solid #ffffff55;border-radius:25px;padding:10px 18px;background:#ffffff20;color:white;cursor:pointer}.modal{position:fixed;inset:0;background:#05071ddd;display:grid;place-items:center;padding:18px;z-index:5}.dialog{width:min(430px,100%);background:linear-gradient(145deg,#352d69,#17183e);border:1px solid #ffffff55;border-radius:25px;padding:25px;text-align:center}.dialog p{line-height:2;white-space:pre-line}.hidden{display:none}.emoji{font-size:42px}</style>
<div class="wrap"><div id="field"></div><div style="position:absolute;top:5%;left:9%;font-size:70px;color:#fff0b5;text-shadow:0 0 25px #ffe7a8">☾</div><section class="panel"><p class="sub">يا سو… عملتلك سما صغيرة، وكل نجمة فيها كلمة من قلبي ليكي 💗</p><h1>نجومك يا سو ✨</h1><p class="sub">اختاري نجمة وافتحي رسالتها… وفيه مفاجأة مستنياكي 🌙</p><div class="stars" id="stars"></div><button onclick="finalMsg()">رسالة من قلبي 💌</button><p class="sub" style="font-size:12px">هدية صغيرة عشان أشوف ضحكتك تاني ❤️</p></section></div>
<div class="modal hidden" id="modal"><div class="dialog"><div class="emoji" id="emoji"></div><h2 id="title"></h2><p id="msg"></p><button onclick="closeM()">رجوع للنجوم ✨</button></div></div>
<script>
const notes=[['🌹','عيونك وضحكتك','عيونك وضحكتك من أكتر الحاجات اللي بحبها… بيخلّوا يومي أحلى وقلبي مبسوط ❤️'],['🌷','طيبتك وحنّيتك','بحب طيبتك وحنّيتك معايا يا بطتي، وبحب إحساسي وأنا بتكلم معاكي 💗'],['🌸','ضحكتك يا سو','نفسي أكون سبب في سعادتك وضحكتك على طول يا سو، وأشوفك دايمًا مبسوطة 🥹💕'],['🌙','حتى وإحنا بعيد','حتى وإحنا بعيد، بتبقي شاغلة تفكيري كله… وبفتكر كلامنا وأبتسم من غير ما أحس ❤️'],['🌻','أحلى صدفة','مبسوط أوي إننا اتقابلنا يا بطتي، وبحب اليوم اللي عرفتك فيه… بقت حاجة غالية عندي 🌷'],['💞','إنتي غالية','عايزك تعرفي إنك غالية عندي، وإن كلامك ومشاعرك مهمين ليا، ومش عايز أستهون بأي حاجة تزعلك 💖'],['🫶','خلينا نتفاهم','لو في حاجة مضايقاكي مني، أنا عايز أسمعك وأفهمك. المهم نكون حنينين على بعض ❤️'],['✨','أمنية صغيرة','بتمنى الأيام الجاية تكون أحلى لينا، ونتعرف على بعض أكتر ونخلق ذكريات حلوة سوا يا سو 💗']];
const pos=[[8,18],[36,5],[72,16],[84,48],[65,72],[35,76],[12,62],[48,42]],area=document.getElementById('stars');
pos.forEach((p,i)=>{let b=document.createElement('button');b.className='star';b.textContent='✦';b.style.left=p[0]+'%';b.style.top=p[1]+'%';b.onclick=()=>show(i);area.appendChild(b)});
for(let i=0;i<100;i++){let s=document.createElement('i');s.style.cssText=`position:absolute;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;background:white;border-radius:50%;left:${Math.random()*100}%;top:${Math.random()*100}%;opacity:${Math.random()*.8}`;document.getElementById('field').appendChild(s)}
function open(t,e,m){document.getElementById('title').textContent=t;document.getElementById('emoji').textContent=e;document.getElementById('msg').textContent=m;document.getElementById('modal').classList.remove('hidden')}function show(i){open(notes[i][1],notes[i][0],notes[i][2])}
function finalMsg(){open('حقك عليا يا سو ❤️','💌','أنا عارف إنك زعلانة مني، ومش حابب أشوفك زعلانة بسببي أبدًا. يمكن أكون غلطت أو ضايقتك من غير ما أقصد، بس آخر حاجة أتمناها إني أكون سبب في زعلك.\n\nإنتي غالية عندي أوي، ومش عايز أي حاجة تخليكي تحسي إني مش مهتم بيكي. ولو أنا غلطان فحقك عليا يا حبيبتي. أنا مستعد أسمعك وأفهم إيه اللي زعلك وأصلح غلطتي، مش مجرد أقول معلش وخلاص.\n\nخدي وقتك لو محتاجة، بس اعرفي إنك فارقة معايا، ونفسي أشوف ضحكتك الحلوة تاني. بحبك يا بطتي ❤️')}
function closeM(){document.getElementById('modal').classList.add('hidden')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
</script>
